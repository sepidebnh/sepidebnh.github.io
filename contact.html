        <!-- header area -->
        <header>
            <img src="images/logo.jpg" alt="Website logo" style="border: none;">

        </header>
        <!-- main navbar -->

                <li><a href="index.html">Home</a></li>

        <main>

            <section>
                <form action="process.php" method="get">
                    <fieldset>
                    <legend>Personal Info:</legend>
                        <label for="fName">First Name:</label>
                        <input type="text" id="fName" name="fName" required autofocus>
                        <br><br>
                        <label for="lName">Last Name:</label>
                        <input type="text" id="lName" name="lName" required>
                        <br><br>
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" required>
                        <input type="radio" id="female" name="gender" value="Female">
                        <label for="female">Female</label><br>
                        <input type="radio" id="male" name="gender" value="Male">
                        <label for="male">Male</label><br>
                        <input type="other" id="other" name="gender" value="Other">
                        <label for="other">Other</label>
                        </fieldset>
                        <br>
                        <label for="postal">Postal Code:</label>
                        <input type="num" name="postal" id="postal" pattern="[0-9]{3}-[A-Za-z]{2}-[0-9]{3}">
                        <p>Choose your method of Commute:</p>
                        <input type="checkbox" id="bus" name="commute" value="Bus">
                        <label for="bus">Bus</label><br>
                        <input type="checkbox" id="train" name="commute" value="Train">
                        <label for="train">Train</label><br>
                        <input type="checkbox" id="boat" name="commute" value="Boat">
                        <label for="boat">Boat</label><br><br>
                        <label for="browsers">Browsers</label>
                        <select name="browsers" id="browsers">
                            <optgroup label="Mac">
                                <option value="Safari">Safari</option>
                                <option value="chrome">Google Chrome</option>

                            </optgroup>
                            <optgroup label="windows">
                                <option value="firefox">Mozilla Firefox</option>
                                <option value="IE">Internet Explorer</option>
                            </optgroup> 
                        </select>
                        <label for="feedback">Provide your Comment</label>
                        <textarea name="comment" id="feedback">Feedback here!</textarea>
                        <br><br>
                        <input type="submit" value="Submit">
                        <br><br>
                </fieldset>
                
                    
                </form>



            </section>
